name: Release Standalone Binaries

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Frontend & Embed Assets
        run: |
          bun install
          cd frontend && bun install && bun run build && cd ..
          bun run scripts/generate-embedded-assets.ts

      - name: Compile Standalone Binaries for All Platforms
        run: |
          mkdir -p ./release-binaries
          bun build --compile --target=bun-linux-x64 ./src/cli/index.ts --outfile=./release-binaries/multikaggle-linux-x64
          bun build --compile --target=bun-linux-arm64 ./src/cli/index.ts --outfile=./release-binaries/multikaggle-linux-arm64
          bun build --compile --target=bun-darwin-arm64 ./src/cli/index.ts --outfile=./release-binaries/multikaggle-darwin-arm64
          bun build --compile --target=bun-darwin-x64 ./src/cli/index.ts --outfile=./release-binaries/multikaggle-darwin-x64
          bun build --compile --target=bun-windows-x64 ./src/cli/index.ts --outfile=./release-binaries/multikaggle-windows-x64.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-binaries/*
          body_path: RELEASE_NOTES.md
